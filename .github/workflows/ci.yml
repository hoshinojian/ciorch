# ciorch 自身 CI（GitHub 托管 runner——编排器不能用自己调度的机器测自己，REDESIGN §3.15）
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # go.mod/go.sum 必须与源一致（防直接依赖被标 indirect 等漂移）
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      # import 边界（实施计划 §3.6）：除提供商实现包自身与 cmd/（装配层）
      # 外，任何包不得 import 提供商实现。-test 连测试文件依赖一并检查。
      - name: import 边界检查
        run: |
          ! go list -test -f '{{.ImportPath}}: {{join .Imports " "}}' ./... \
            | grep -v '^github.com/hoshinojian/ciorch/internal/provider/' \
            | grep -v '^github.com/hoshinojian/ciorch/cmd/' \
            | grep 'internal/provider/'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o bin/ciorch ./cmd/ciorch
